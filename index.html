<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>智慧课评系统 · 实时同步版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(145deg, #F4F7FC 0%, #EFF2F8 100%); font-family: system-ui, 'Segoe UI', 'PingFang SC', Roboto, sans-serif; padding: 20px 16px 40px; min-height: 100vh; color: #1E2F3E; }
        .container { max-width: 1400px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 16px; }
        .sync-status { background: #e8f5e9; border-radius: 40px; padding: 6px 16px; font-size: 0.8rem; display: inline-flex; align-items: center; gap: 8px; }
        .sync-status.online { background: #c8e6c9; color: #2e7d32; }
        .sync-status.offline { background: #ffebee; color: #c62828; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; background: rgba(255,255,255,0.6); padding: 6px 12px; border-radius: 60px; backdrop-filter: blur(4px); }
        .tab-btn { background: transparent; border: none; padding: 8px 20px; border-radius: 40px; font-weight: 600; font-size: 0.85rem; cursor: pointer; color: #2C5A77; transition: 0.2s; }
        .tab-btn.active { background: linear-gradient(95deg, #F08B6A, #E56A4F); color: white; box-shadow: 0 4px 12px rgba(240,139,106,0.3); }
        .tab-pane { display: none; animation: fadeIn 0.2s ease; }
        .tab-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: rgba(255,255,255,0.96); border-radius: 1.5rem; box-shadow: 0 8px 20px -6px rgba(0,0,0,0.08); border: 1px solid rgba(255,255,255,0.6); margin-bottom: 1.5rem; overflow: hidden; }
        .card-header { background: #FFFFFFF0; padding: 0.9rem 1.5rem; border-bottom: 2px solid #FFE6DC; font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; color: #2C5A77; }
        .card-body { padding: 1.2rem; }
        .grid-2cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
        .form-group { margin-bottom: 1rem; }
        label { font-weight: 600; font-size: 0.8rem; display: block; margin-bottom: 5px; color: #2C5A77; }
        input, textarea, select { width: 100%; padding: 0.6rem 0.9rem; border-radius: 1rem; border: 1px solid #DCE5EC; font-family: inherit; font-size: 0.9rem; background: white; }
        textarea { resize: vertical; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #F08B6A; box-shadow: 0 0 0 3px rgba(240,139,106,0.1); }
        .btn { border: none; padding: 6px 16px; border-radius: 40px; font-weight: 600; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; background: white; border: 1px solid #D0DCE8; color: #2C5A77; transition: 0.2s; }
        .btn-primary { background: linear-gradient(95deg, #F08B6A, #E56A4F); color: white; border: none; }
        .btn-sm { padding: 4px 10px; font-size: 0.7rem; }
        .btn-danger { border-color: #FFB5A8; color: #D9583C; }
        .btn-success { background: #5CB89D; color: white; border: none; }
        .flex-btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem; align-items: flex-end; }
        .table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; min-width: 500px; }
        .data-table th, .data-table td { padding: 10px 8px; border-bottom: 1px solid #EDEFF2; text-align: left; vertical-align: middle; }
        .data-table th { background: #F8FAFE; font-weight: 600; }
        .student-check-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; max-height: 160px; overflow-y: auto; background: #F9FBFD; padding: 10px; border-radius: 1rem; }
        .student-check-item { display: inline-flex; align-items: center; gap: 6px; background: #F1F5F9; padding: 4px 12px; border-radius: 40px; }
        .slider-container { background: #F8FAFE; border-radius: 1rem; padding: 0.6rem 1rem; margin: 0.5rem 0; }
        .word-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
        .gen-card { background: #FFFDF5; border-radius: 1rem; padding: 1rem; margin-bottom: 1rem; border: 1px solid #FFE0D0; }
        .gen-card-header { font-weight: 700; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px dashed #FFDCC8; }
        .result-preview { background: #FFFEF8; border-radius: 1rem; padding: 0.8rem; border: 1px solid #FCE5D9; line-height: 1.5; white-space: pre-wrap; }
        .class-tag { background: #ffefcf; border-radius: 60px; padding: 6px 16px; display: inline-flex; align-items: center; gap: 8px; }
        .toast-msg { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1E2F3E; color: white; padding: 8px 20px; border-radius: 50px; font-size: 0.8rem; z-index: 2000; opacity: 0; transition: 0.2s; pointer-events: none; text-align: center; max-width: 90%; }
        .loading-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 5px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .info-note { font-size: 0.7rem; background: #F0F4F9; border-radius: 30px; padding: 5px 10px; margin-top: 8px; }
        .editable-field { cursor: pointer; color: #E56A4F; }
        .editable-field:hover { text-decoration: underline; }
        .modal-mask { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; visibility: hidden; opacity:0; transition: 0.15s; }
        .modal-mask.show { visibility: visible; opacity:1; }
        .history-modal { background: #fffaf0; border-radius: 40px; width: 90%; max-width: 700px; max-height: 80vh; overflow-y: auto; padding: 20px; }
        .close-btn { float: right; background: #ffb46e; padding: 4px 12px; border-radius: 30px; cursor: pointer; }
        @media (max-width: 640px) { .card-header { flex-direction: column; align-items: flex-start; } .btn { padding: 6px 12px; } .tab-btn { padding: 6px 14px; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <div class="sync-status" id="syncStatus"><span>🔄</span> <span id="syncText">实时同步中...</span></div>
    </div>
    <div class="tabs">
        <button class="tab-btn active" data-tab="config">⚙️ 班级 & 学生管理</button>
        <button class="tab-btn" data-tab="record">📝 课堂记录生成</button>
        <button class="tab-btn" data-tab="monthly">📅 月度整合</button>
    </div>

    <!-- 选项卡1：班级与学生管理 -->
    <div id="tab-config" class="tab-pane active">
        <div class="card">
            <div class="card-header">🤖 豆包API 配置</div>
            <div class="card-body">
                <div class="grid-2cols">
                    <div class="form-group"><label>API Key</label><input type="password" id="apiKey" placeholder="火山引擎 API Key"></div>
                    <div class="form-group"><label>接入点ID</label><input type="text" id="modelId" placeholder="ep-xxxxxxxxxx"></div>
                    <div class="form-group"><label>端点地址</label><input type="text" id="endpoint" value="https://ark.cn-beijing.volces.com/api/v3/chat/completions"></div>
                    <div class="flex-btns"><button id="testApiBtn" class="btn">🔍 测试</button><button id="saveApiBtn" class="btn btn-primary">💾 保存</button></div>
                </div>
                <div id="apiTestStatus" class="info-note"></div>
            </div>
        </div>
        <div class="card">
            <div class="card-header">🏷️ 班级管理 <button id="addClassBtn" class="btn btn-sm btn-primary">➕ 新班级</button></div>
            <div class="card-body"><div class="flex-btns" id="classListContainer" style="flex-wrap:wrap; gap:8px;"></div><div class="info-note">点击班级可编辑，删除班级会清除该班级下所有学生及记录</div></div>
        </div>
        <div class="card">
            <div class="card-header">👥 学生管理</div>
            <div class="card-body">
                <div class="grid-2cols" style="margin-bottom:1rem;">
                    <div class="form-group"><label>学号</label><input type="text" id="stuId" placeholder="学号"></div>
                    <div class="form-group"><label>姓名</label><input type="text" id="stuName" placeholder="姓名"></div>
                    <div class="form-group"><label>班级</label><select id="stuClassSelect"></select></div>
                    <div class="flex-btns"><button id="addStudentBtn" class="btn btn-primary">➕ 添加/更新</button><button id="clearStudentForm" class="btn">清空</button></div>
                </div>
                <div class="filter-bar">
                    <div class="form-group" style="flex:1"><label>班级筛选</label><select id="filterClassSelect"></select></div>
                    <div class="form-group" style="flex:1"><label>姓名搜索</label><input type="text" id="searchNameInput" placeholder="学生姓名"></div>
                    <button id="refreshStudentListBtn" class="btn btn-sm">刷新</button>
                </div>
                <div class="table-wrapper"><table class="data-table"><thead><tr><th>学号</th><th>姓名</th><th>班级</th><th>操作</th></tr></thead><tbody id="studentTbody"></tbody>}</div>
            </div>
        </div>
        <div class="card">
            <div class="card-header">💾 数据备份与迁移</div>
            <div class="card-body"><div class="flex-btns"><button id="exportDataBtn" class="btn btn-primary">📤 导出备份(JSON)</button><button id="importDataBtn" class="btn">📥 导入备份(JSON)</button><button id="clearAllDataBtn" class="btn btn-danger">⚠️ 清空所有数据</button></div><div class="info-note">💡 导出备份后可在其他设备导入，实现数据迁移。</div></div>
        </div>
    </div>

    <!-- 选项卡2：课堂记录生成 -->
    <div id="tab-record" class="tab-pane">
        <div class="card">
            <div class="card-header">✨ 生成课评（可编辑后再保存）</div>
            <div class="card-body">
                <div class="slider-container"><div class="word-row"><label>🎯 目标字数/生</label><span id="wordCountValue" style="background:#E9EDF2; padding:0.2rem 1rem; border-radius:30px;">130</span></div><input type="range" id="wordSlider" min="60" max="300" value="130" step="5"></div>
                <div class="filter-bar"><select id="classFilterSelectGen" style="width:150px;"><option value="">全部班级</option></select><input type="text" id="nameFilterSelectGen" placeholder="姓名搜索" style="width:150px;"><button id="refreshStudentListGenBtn" class="btn btn-sm">刷新可选学生</button></div>
                <div id="studentChecklist" class="student-check-group"></div>
                <div class="grid-2cols" style="margin-top:12px;"><div class="form-group"><label>📖 课堂内容</label><textarea id="classContentInput" rows="2" placeholder="课堂内容"></textarea></div><div class="form-group"><label>💬 通用表现（参考）</label><textarea id="generalPerf" rows="2" placeholder="通用表现"></textarea></div></div>
                <div class="perf-panel" style="margin-top:12px;"><div class="perf-title" id="toggleIndividualBtn" style="font-weight:700; cursor:pointer; color:#F08B6A;">👤 按学生单独填写表现（优先级高） ▼</div><div id="individualPerfArea" style="display:none; background:#FFFDF6; border-radius:1rem; padding:12px; margin-top:8px;"></div></div>
                <div class="flex-btns" style="margin-top:12px;"><button id="generatePreviewBtn" class="btn btn-primary">✨ 生成课评预览（可编辑）</button></div>
                <div id="generatedPreviews" style="margin-top:16px;"></div>
            </div>
        </div>
        <div class="card">
            <div class="card-header"><span>📋 课堂记录</span><div class="flex-btns"><button id="batchDeleteBtn" class="btn btn-sm btn-danger">🗑️ 批量删除</button><button id="selectAllRecordsBtn" class="btn btn-sm">✅ 全选</button></div></div>
            <div class="card-body">
                <div class="filter-bar"><input type="text" id="recordSearchInput" placeholder="搜索姓名或班级" style="flex:2;"><button id="searchRecordsBtn" class="btn btn-sm">🔍 搜索</button><button id="resetRecordsBtn" class="btn btn-sm">重置（最近10条）</button></div>
                <div class="table-wrapper"><table class="data-table" id="recordTable"><thead><tr><th><input type="checkbox" id="recordSelectAllCheckbox"></th><th>学生</th><th>班级</th><th>课堂内容</th><th>课评</th><th>时间</th><th>操作</th></tr></thead><tbody id="recordTbody"></tbody>}</div>
            </div>
        </div>
    </div>

    <!-- 选项卡3：月度整合 -->
    <div id="tab-monthly" class="tab-pane">
        <div class="card">
            <div class="card-header">📅 月度课评整合（可编辑/复制）</div>
            <div class="card-body">
                <div class="grid-2cols"><div class="form-group"><label>学生</label><select id="studentSelect"></select></div><div class="form-group"><label>月份</label><input type="month" id="monthPicker"></div></div>
                <div class="slider-container"><div style="display:flex; justify-content:space-between;"><span>目标字数</span><span id="targetWordDisplay">180</span></div><input type="range" id="monthWordSlider" min="80" max="400" value="180" step="10"></div>
                <div class="flex-btns"><button id="viewRecordsBtn" class="btn">📋 查看本月记录</button><button id="generateSummaryBtn" class="btn btn-primary">✨ 生成AI总结</button></div>
                <div style="margin-top:16px;"><strong>📚 课堂内容汇总</strong><button id="copyContentSummaryBtn" class="btn btn-sm" style="margin-left:10px;">📋 复制</button><div id="classContentSummary" class="result-preview" style="margin-top:6px;">-</div></div>
                <div style="margin-top:16px;"><strong>🤖 月度总结（可编辑）</strong><button id="copyMonthlySummaryBtn" class="btn btn-sm" style="margin-left:10px;">📋 复制</button><textarea id="monthlySummaryEditable" rows="6" class="result-preview" style="width:100%; margin-top:6px;"></textarea></div>
            </div>
        </div>
    </div>
</div>
<div id="toastMsg" class="toast-msg"></div>
<div id="historyModal" class="modal-mask"><div class="history-modal"><h3 id="historyStudentName">积分变动记录</h3><button class="close-btn" onclick="document.getElementById('historyModal').classList.remove('show')">✖️ 关闭</button><div id="dailySummaryContainer"></div><ul id="historyList"></ul></div></div>

<script>
    // Supabase 配置（使用您现有的项目）
    const SUPABASE_URL = "https://jquoooxqmwlqnqkpfxrm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_bkQDJ3_R0zStq2yia6zotw_tPh_ePvV";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // 数据存储
    let students = [];
    let records = [];
    let classes = [];
    let individualPerfMap = {};
    let currentTab = "config";
    let currentRecordFilter = "";
    
    // 辅助函数
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = msg;
        toast.style.background = isError ? '#D9583C' : '#1E2F3E';
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2500);
    }
    function escapeHtml(str) { if(!str) return ''; return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }
    function updateSyncStatus(online) {
        const statusDiv = document.getElementById('syncStatus');
        const syncText = document.getElementById('syncText');
        if(online) { statusDiv.className = 'sync-status online'; syncText.innerHTML = '✅ 实时同步已连接'; }
        else { statusDiv.className = 'sync-status offline'; syncText.innerHTML = '⚠️ 离线模式'; }
    }
    window.addEventListener('online', () => updateSyncStatus(true));
    window.addEventListener('offline', () => updateSyncStatus(false));
    updateSyncStatus(navigator.onLine);
    
    function getClassNameById(classId) { return classes.find(c => c.id === classId)?.name || '未知班级'; }
    
    // 数据加载
    async function loadClasses() {
        const { data, error } = await supabase.from('review_classes').select('*').order('name');
        if(error) { console.error(error); return; }
        classes = data || [];
        if(classes.length === 0) {
            const defaultClasses = [{ id: Date.now(), name: '三年级2班' }, { id: Date.now()+1, name: '三年级1班' }];
            for(let c of defaultClasses) await supabase.from('review_classes').insert(c);
            classes = defaultClasses;
        }
        refreshClassSelects();
        renderClassList();
    }
    async function loadStudents() {
        const { data, error } = await supabase.from('review_students').select('*').order('name');
        if(error) { console.error(error); return; }
        students = data || [];
        refreshAll();
    }
    async function loadRecords() {
        const { data, error } = await supabase.from('review_records').select('*').order('recordDate', { ascending: false });
        if(error) { console.error(error); return; }
        records = data || [];
        refreshRecordList();
    }
    async function loadApiConfig() {
        const { data, error } = await supabase.from('review_config').select('key, value').eq('key', 'api_config');
        if(data && data[0]) {
            const cfg = data[0].value;
            document.getElementById('apiKey').value = cfg.apiKey || '';
            document.getElementById('modelId').value = cfg.modelId || '';
            document.getElementById('endpoint').value = cfg.endpoint || 'https://ark.cn-beijing.volces.com/api/v3/chat/completions';
        }
    }
    async function saveApiConfigToDB() {
        const cfg = { apiKey: document.getElementById('apiKey').value.trim(), modelId: document.getElementById('modelId').value.trim(), endpoint: document.getElementById('endpoint').value.trim() };
        await supabase.from('review_config').upsert({ key: 'api_config', value: cfg }, { onConflict: 'key' });
    }
    
    // 实时订阅
    function subscribeToRealtime() {
        supabase.channel('review-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'review_classes' }, () => { loadClasses(); })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'review_students' }, () => { loadStudents(); })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'review_records' }, () => { loadRecords(); })
            .subscribe();
    }
    
    // 班级管理
    function renderClassList() {
        const container = document.getElementById('classListContainer');
        if(!container) return;
        container.innerHTML = classes.map(cls => `<span class="class-tag">${escapeHtml(cls.name)} <button class="editClassBtn" data-id="${cls.id}" style="background:none;border:none;color:#F08B6A;">✏️</button> <button class="delClassBtn" data-id="${cls.id}" style="background:none;border:none;color:#D9583C;">🗑️</button></span>`).join('');
        document.querySelectorAll('.editClassBtn').forEach(btn => btn.addEventListener('click', async (e) => {
            const id = parseInt(btn.dataset.id);
            const cls = classes.find(c => c.id === id);
            const newName = prompt('编辑班级名称', cls.name);
            if(newName && newName.trim()) {
                await supabase.from('review_classes').update({ name: newName.trim() }).eq('id', id);
                loadClasses();
                showToast('班级已更新');
            }
        }));
        document.querySelectorAll('.delClassBtn').forEach(btn => btn.addEventListener('click', async (e) => {
            const id = parseInt(btn.dataset.id);
            if(confirm('删除班级将删除该班级下所有学生及课堂记录，确定吗？')) {
                await supabase.from('review_students').delete().eq('classId', id);
                await supabase.from('review_records').delete().eq('classId', id);
                await supabase.from('review_classes').delete().eq('id', id);
                loadClasses(); loadStudents(); loadRecords();
                showToast('已删除班级及相关数据');
            }
        }));
    }
    function refreshClassSelects() {
        ['stuClassSelect', 'filterClassSelect', 'classFilterSelectGen'].forEach(id => {
            const sel = document.getElementById(id);
            if(sel) sel.innerHTML = '<option value="">全部班级</option>' + classes.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
        });
    }
    
    // 学生管理
    function renderStudentTable() {
        const classId = document.getElementById('filterClassSelect').value;
        const nameSearch = document.getElementById('searchNameInput').value.trim();
        let filtered = students.filter(s => (!classId || s.classId == classId) && (!nameSearch || s.name.includes(nameSearch)));
        const tbody = document.getElementById('studentTbody');
        if(!tbody) return;
        tbody.innerHTML = '';
        filtered.forEach(s => {
            const className = getClassNameById(s.classId);
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${escapeHtml(s.stuId)}</td><td>${escapeHtml(s.name)}</td><td>${escapeHtml(className)}</td>
            <td><button class="btn btn-sm editStudentBtn" data-id="${s.id}">编辑</button> <button class="btn btn-sm btn-danger delStudentBtn" data-id="${s.id}">删除</button></td>`;
            tbody.appendChild(tr);
        });
        document.querySelectorAll('.editStudentBtn').forEach(btn => btn.addEventListener('click', (e) => { const id = parseInt(btn.dataset.id); editStudentById(id); }));
        document.querySelectorAll('.delStudentBtn').forEach(btn => btn.addEventListener('click', async (e) => { const id = parseInt(btn.dataset.id); if(confirm('删除学生也将删除其所有课堂记录')) { await supabase.from('review_students').delete().eq('id', id); await supabase.from('review_records').delete().eq('studentId', id); loadStudents(); loadRecords(); showToast('已删除'); } }));
    }
    function editStudentById(id) {
        const stu = students.find(s => s.id === id);
        if(stu) {
            document.getElementById('stuId').value = stu.stuId;
            document.getElementById('stuName').value = stu.name;
            document.getElementById('stuClassSelect').value = stu.classId;
            const addBtn = document.getElementById('addStudentBtn');
            addBtn.innerText = '✏️ 更新学生';
            addBtn.dataset.editId = id;
        }
    }
    async function handleAddOrUpdateStudent() {
        const stuId = document.getElementById('stuId').value.trim();
        const name = document.getElementById('stuName').value.trim();
        const classId = parseInt(document.getElementById('stuClassSelect').value);
        if(!stuId || !name || !classId) { showToast('请填写完整信息', true); return; }
        const addBtn = document.getElementById('addStudentBtn');
        if(addBtn.dataset.editId) {
            const id = parseInt(addBtn.dataset.editId);
            await supabase.from('review_students').update({ stuId, name, classId }).eq('id', id);
            showToast('更新成功');
            delete addBtn.dataset.editId;
            addBtn.innerText = '➕ 添加/更新';
        } else {
            const newId = Date.now();
            await supabase.from('review_students').insert({ id: newId, stuId, name, classId, points: 0 });
            showToast('添加成功');
        }
        document.getElementById('stuId').value = '';
        document.getElementById('stuName').value = '';
        await loadStudents();
    }
    
    // 记录操作
    async function addRecord(record) { await supabase.from('review_records').insert(record); }
    async function deleteRecord(recordId) { await supabase.from('review_records').delete().eq('id', recordId); }
    async function updateRecord(recordId, updates) { await supabase.from('review_records').update(updates).eq('id', recordId); }
    
    function refreshRecordList() {
        let filtered = [...records];
        if(currentRecordFilter) {
            filtered = filtered.filter(r => r.studentName.includes(currentRecordFilter) || (getClassNameById(r.classId) || '').includes(currentRecordFilter));
        }
        const displayList = currentRecordFilter ? filtered : filtered.slice(0, 10);
        const tbody = document.getElementById('recordTbody');
        if(!tbody) return;
        tbody.innerHTML = '';
        displayList.forEach(rec => {
            const tr = document.createElement('tr');
            tr.dataset.id = rec.id;
            tr.innerHTML = `
                <td><input type="checkbox" class="record-checkbox" value="${rec.id}"></td>
                <td>${escapeHtml(rec.studentName)}</td>
                <td>${escapeHtml(getClassNameById(rec.classId))}</td>
                <td><div class="editable-field editable-class" data-id="${rec.id}">${escapeHtml(rec.classContent)}</div></td>
                <td><div class="editable-field editable-review" data-id="${rec.id}">${escapeHtml(rec.reviewText.substring(0, 60))}${rec.reviewText.length>60?'…':''}</div></td>
                <td><input type="datetime-local" class="rec-date-edit" data-id="${rec.id}" value="${rec.recordDate.replace(' ', 'T')}" style="width:130px;"></td>
                <td><button class="btn btn-sm saveRecordBtn" data-id="${rec.id}">💾 保存</button> <button class="btn btn-sm btn-danger delRecordBtn" data-id="${rec.id}">删除</button></td>`;
            tbody.appendChild(tr);
        });
        bindRecordEvents();
    }
    function bindRecordEvents() {
        document.querySelectorAll('.saveRecordBtn').forEach(btn => btn.addEventListener('click', async (e) => { const rid = parseInt(btn.dataset.id); await saveRecordEdit(rid); }));
        document.querySelectorAll('.delRecordBtn').forEach(btn => btn.addEventListener('click', async (e) => { const rid = parseInt(btn.dataset.id); if(confirm('删除该记录？')) { await deleteRecord(rid); loadRecords(); showToast('已删除'); } }));
        document.querySelectorAll('.rec-date-edit').forEach(inp => inp.addEventListener('change', async (e) => { const rid = parseInt(inp.dataset.id); await updateRecord(rid, { recordDate: inp.value.replace('T', ' ') }); loadRecords(); showToast('时间已更新'); }));
        document.querySelectorAll('.editable-class').forEach(div => div.addEventListener('click', async (e) => { const rid = parseInt(div.dataset.id); const rec = records.find(r => r.id === rid); if(rec) { const newVal = prompt('修改课堂内容', rec.classContent); if(newVal && newVal.trim()) { await updateRecord(rid, { classContent: newVal.trim() }); loadRecords(); showToast('已更新'); } } }));
        document.querySelectorAll('.editable-review').forEach(div => div.addEventListener('click', async (e) => { const rid = parseInt(div.dataset.id); const rec = records.find(r => r.id === rid); if(rec) { const newVal = prompt('修改课评', rec.reviewText); if(newVal && newVal.trim()) { await updateRecord(rid, { reviewText: newVal.trim() }); loadRecords(); showToast('已更新'); } } }));
    }
    async function saveRecordEdit(rid) {
        const rec = records.find(r => r.id === rid);
        if(!rec) return;
        const classDiv = document.querySelector(`.editable-class[data-id="${rid}"]`);
        const reviewDiv = document.querySelector(`.editable-review[data-id="${rid}"]`);
        const dateInp = document.querySelector(`.rec-date-edit[data-id="${rid}"]`);
        if(classDiv && reviewDiv && dateInp) {
            await updateRecord(rid, { classContent: classDiv.innerText.trim(), reviewText: reviewDiv.innerText.trim(), recordDate: dateInp.value.replace('T', ' ') });
            showToast('已保存');
            loadRecords();
        }
    }
    async function batchDeleteRecords() {
        const checked = Array.from(document.querySelectorAll('.record-checkbox:checked')).map(cb => parseInt(cb.value));
        if(checked.length === 0) { showToast('请选择记录', true); return; }
        if(confirm(`删除 ${checked.length} 条记录？`)) {
            for(let id of checked) await deleteRecord(id);
            loadRecords();
            showToast(`已删除 ${checked.length} 条`);
        }
    }
    function selectAllRecords() { document.querySelectorAll('.record-checkbox').forEach(cb => cb.checked = document.getElementById('recordSelectAllCheckbox').checked); }
    
    // 生成课评预览
    function renderStudentChecklist() {
        const classFilter = document.getElementById('classFilterSelectGen').value;
        const nameFilter = document.getElementById('nameFilterSelectGen').value.trim();
        let filtered = students.filter(s => (!classFilter || s.classId == classFilter) && (!nameFilter || s.name.includes(nameFilter)));
        const container = document.getElementById('studentChecklist');
        if(container) container.innerHTML = filtered.map(s => `<label class="student-check-item"><input type="checkbox" class="stuCheckItem" value="${s.id}"> ${escapeHtml(s.name)} (${getClassNameById(s.classId)})</label>`).join('');
    }
    async function generateSingleReview(studentName, classContent, performance, apiConfig, targetWords) {
        const angles = ['学习态度', '参与度', '专注力', '进步幅度', '与同学互动', '练习完成情况'];
        const angle = angles[Math.floor(Math.random() * angles.length)];
        const prompt = `请为“${studentName}”同学写一段课后评价，要求：
1. 开头必须为“${studentName}本节课……”，结合课堂内容“${classContent}”。
2. 字数严格控制在${targetWords}字左右，口语化亲切。
3. 重点围绕“${angle}”来评价。具体表现“${performance || '无'}”，请融入。
4. 绝对不能出现“你”字！要用“${studentName}”或直接叙述。
5. 结尾用1-2个emoji和鼓励。直接输出评价文本。`;
        const res = await fetch(apiConfig.endpoint, {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiConfig.apiKey}` },
            body: JSON.stringify({ model: apiConfig.modelId, messages: [{ role: 'user', content: prompt }], max_tokens: Math.min(400, targetWords * 2 + 50), temperature: 0.85 })
        });
        if(!res.ok) throw new Error(`API错误 ${res.status}`);
        const data = await res.json();
        let review = data.choices?.[0]?.message?.content?.trim() || '';
        review = review.replace(/你/g, studentName);
        if(!review.startsWith(studentName)) review = studentName + '本节课' + review;
        return review;
    }
    async function generatePreviews() {
        const classContent = document.getElementById('classContentInput').value.trim();
        if(!classContent) { showToast('请填写课堂内容', true); return; }
        const selectedBoxes = Array.from(document.querySelectorAll('.stuCheckItem:checked'));
        if(selectedBoxes.length === 0) { showToast('请至少选择一位学生', true); return; }
        const targetWords = parseInt(document.getElementById('wordSlider').value);
        const generalPerf = document.getElementById('generalPerf').value.trim();
        const apiConfig = { apiKey: document.getElementById('apiKey').value.trim(), modelId: document.getElementById('modelId').value.trim(), endpoint: document.getElementById('endpoint').value.trim() };
        if(!apiConfig.apiKey || !apiConfig.modelId) { showToast('请先配置豆包API', true); return; }
        const genBtn = document.getElementById('generatePreviewBtn');
        genBtn.disabled = true;
        genBtn.innerHTML = '<span class="loading-spinner"></span> 生成中...';
        const container = document.getElementById('generatedPreviews');
        container.innerHTML = '<div class="info-note">⏳ 正在生成...</div>';
        const results = [];
        for(const cb of selectedBoxes) {
            const sid = parseInt(cb.value);
            const student = students.find(s => s.id === sid);
            if(!student) continue;
            try {
                const review = await generateSingleReview(student.name, classContent, generalPerf, apiConfig, targetWords);
                results.push({ studentId: student.id, studentName: student.name, classId: student.classId, classContent, reviewText: review });
            } catch(err) { results.push({ studentId: student.id, studentName: student.name, classId: student.classId, classContent, reviewText: `生成失败: ${err.message}` }); }
        }
        container.innerHTML = results.map((res, idx) => `<div class="gen-card" data-idx="${idx}"><div class="gen-card-header"><span>👩‍🎓 ${escapeHtml(res.studentName)}</span><div class="flex-btns"><button class="btn btn-sm copy-single-btn" data-idx="${idx}">📋 复制课评</button><button class="btn btn-sm btn-success save-single-btn" data-idx="${idx}">💾 保存到记录</button></div></div><textarea class="gen-card-content" data-idx="${idx}" rows="5">${escapeHtml(res.reviewText)}</textarea></div>`).join('');
        results.forEach((res, idx) => {
            const copyBtn = container.querySelector(`.copy-single-btn[data-idx="${idx}"]`);
            const saveBtn = container.querySelector(`.save-single-btn[data-idx="${idx}"]`);
            const textarea = container.querySelector(`.gen-card-content[data-idx="${idx}"]`);
            if(copyBtn) copyBtn.onclick = () => { navigator.clipboard.writeText(textarea.value); showToast(`已复制 ${res.studentName} 的课评`); };
            if(saveBtn) saveBtn.onclick = async () => {
                const finalReview = textarea.value.trim();
                if(finalReview.includes('生成失败')) { showToast('课评无效，无法保存', true); return; }
                const now = new Date();
                const recordTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
                await addRecord({ id: Date.now() + Math.random(), studentId: res.studentId, studentName: res.studentName, classId: res.classId, classContent: res.classContent, reviewText: finalReview, recordDate: recordTime });
                loadRecords();
                showToast(`已保存 ${res.studentName} 的课评`);
                const card = saveBtn.closest('.gen-card');
                if(card) card.remove();
            };
        });
        genBtn.disabled = false;
        genBtn.innerHTML = '✨ 生成课评预览（可编辑）';
    }
    
    // 月度整合
    function refreshMonthStudentSelect() {
        const sel = document.getElementById('studentSelect');
        if(sel) sel.innerHTML = '<option value="">选择学生</option>' + students.map(s => `<option value="${s.id}">${escapeHtml(s.name)} (${getClassNameById(s.classId)})</option>`).join('');
    }
    function viewMonthRecords() {
        const studentId = parseInt(document.getElementById('studentSelect').value);
        const monthVal = document.getElementById('monthPicker').value;
        if(!studentId || !monthVal) { showToast('请选择学生和月份', true); return; }
        const monthRecords = records.filter(r => r.studentId === studentId && r.recordDate.startsWith(monthVal));
        if(monthRecords.length === 0) {
            document.getElementById('classContentSummary').innerHTML = '本月无课堂记录';
            document.getElementById('monthlySummaryEditable').value = '暂无课评记录';
            return;
        }
        const contents = [...new Set(monthRecords.map(r => r.classContent))];
        document.getElementById('classContentSummary').innerHTML = contents.map(c => `• ${escapeHtml(c)}`).join('<br>') || '无';
        const preview = monthRecords.map(r => `【${r.recordDate.slice(5,10)}】${r.reviewText}`).join('\n\n');
        document.getElementById('monthlySummaryEditable').value = preview;
    }
    async function generateMonthlySummary() {
        const studentId = parseInt(document.getElementById('studentSelect').value);
        const monthVal = document.getElementById('monthPicker').value;
        const targetWords = parseInt(document.getElementById('monthWordSlider').value);
        if(!studentId || !monthVal) { showToast('请选择学生和月份', true); return; }
        const student = students.find(s => s.id === studentId);
        const monthRecords = records.filter(r => r.studentId === studentId && r.recordDate.startsWith(monthVal));
        if(monthRecords.length === 0) { showToast('本月无课评记录', true); return; }
        const reviewsText = monthRecords.map((r, idx) => `${idx+1}. ${r.reviewText}`).join('\n\n');
        const apiConfig = { apiKey: document.getElementById('apiKey').value.trim(), modelId: document.getElementById('modelId').value.trim(), endpoint: document.getElementById('endpoint').value.trim() };
        if(!apiConfig.apiKey || !apiConfig.modelId) { showToast('请先配置豆包API', true); return; }
        const systemPrompt = `整合学生本月课评成专业月度总结，字数${targetWords}字左右，不要出现“你”字，连贯段落。`;
        const userMessage = `学生“${student.name}”本月课评：\n${reviewsText}`;
        const genBtn = document.getElementById('generateSummaryBtn');
        genBtn.disabled = true;
        genBtn.innerHTML = '<span class="loading-spinner"></span> 生成中...';
        try {
            const res = await fetch(apiConfig.endpoint, {
                method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${apiConfig.apiKey}`},
                body: JSON.stringify({ model: apiConfig.modelId, messages: [{ role: 'system', content: systemPrompt },{ role: 'user', content: userMessage }], temperature: 0.7, max_tokens: Math.min(800, targetWords*2+80) })
            });
            if(!res.ok) throw new Error();
            const data = await res.json();
            let summary = data.choices?.[0]?.message?.content?.trim() || '生成失败';
            summary = summary.replace(/你/g, student.name);
            document.getElementById('monthlySummaryEditable').value = summary;
        } catch(e) { showToast(`整合失败`, true); }
        finally { genBtn.disabled = false; genBtn.innerHTML = '✨ 生成月度课评总结'; }
    }
    
    // 导入导出
    async function exportData() {
        const exportObj = { classes, students, records };
        const dataStr = JSON.stringify(exportObj, null, 2);
        const blob = new Blob([dataStr], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `课评系统备份_${new Date().toISOString().slice(0,19)}.json`;
        a.click(); URL.revokeObjectURL(url);
        showToast('导出成功');
    }
    async function importData(file) {
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const data = JSON.parse(e.target.result);
                if(data.classes) for(let c of data.classes) await supabase.from('review_classes').upsert(c, { onConflict: 'id' });
                if(data.students) for(let s of data.students) await supabase.from('review_students').upsert(s, { onConflict: 'id' });
                if(data.records) for(let r of data.records) await supabase.from('review_records').upsert(r, { onConflict: 'id' });
                showToast('导入成功');
                await loadClasses(); await loadStudents(); await loadRecords();
            } catch(err) { showToast('文件格式错误', true); }
        };
        reader.readAsText(file);
    }
    async function clearAllData() {
        if(confirm('⚠️ 清空所有学生和记录数据，不可恢复！')) {
            await supabase.from('review_students').delete().neq('id', 0);
            await supabase.from('review_records').delete().neq('id', 0);
            await loadStudents(); await loadRecords();
            showToast('已清空所有数据');
        }
    }
    
    function refreshAll() {
        if(currentTab === 'config') { renderStudentTable(); renderClassList(); }
        else if(currentTab === 'record') { renderStudentChecklist(); refreshRecordList(); }
        else if(currentTab === 'monthly') { refreshMonthStudentSelect(); }
    }
    
    // 初始化
    async function init() {
        updateSyncStatus(navigator.onLine);
        await loadClasses();
        await loadStudents();
        await loadRecords();
        await loadApiConfig();
        subscribeToRealtime();
        
        // 选项卡切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.dataset.tab;
                document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                document.getElementById(`tab-${tabId}`).classList.add('active');
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTab = tabId;
                refreshAll();
            });
        });
        
        // 按钮事件
        document.getElementById('addStudentBtn')?.addEventListener('click', handleAddOrUpdateStudent);
        document.getElementById('clearStudentForm')?.addEventListener('click', () => { document.getElementById('stuId').value = ''; document.getElementById('stuName').value = ''; const btn = document.getElementById('addStudentBtn'); delete btn.dataset.editId; btn.innerText = '➕ 添加/更新'; });
        document.getElementById('refreshStudentListBtn')?.addEventListener('click', () => renderStudentTable());
        document.getElementById('refreshStudentListGenBtn')?.addEventListener('click', renderStudentChecklist);
        document.getElementById('generatePreviewBtn')?.addEventListener('click', generatePreviews);
        document.getElementById('searchRecordsBtn')?.addEventListener('click', () => { currentRecordFilter = document.getElementById('recordSearchInput').value.trim(); refreshRecordList(); });
        document.getElementById('resetRecordsBtn')?.addEventListener('click', () => { currentRecordFilter = ''; document.getElementById('recordSearchInput').value = ''; refreshRecordList(); });
        document.getElementById('batchDeleteBtn')?.addEventListener('click', batchDeleteRecords);
        document.getElementById('selectAllRecordsBtn')?.addEventListener('click', () => { const cb = document.getElementById('recordSelectAllCheckbox'); cb.checked = !cb.checked; selectAllRecords(); });
        document.getElementById('recordSelectAllCheckbox')?.addEventListener('change', selectAllRecords);
        document.getElementById('viewRecordsBtn')?.addEventListener('click', viewMonthRecords);
        document.getElementById('generateSummaryBtn')?.addEventListener('click', generateMonthlySummary);
        document.getElementById('copyContentSummaryBtn')?.addEventListener('click', () => { const text = document.getElementById('classContentSummary').innerText; if(text && text !== '-') navigator.clipboard.writeText(text); showToast('已复制'); });
        document.getElementById('copyMonthlySummaryBtn')?.addEventListener('click', () => { const text = document.getElementById('monthlySummaryEditable').value; if(text) navigator.clipboard.writeText(text); showToast('已复制'); });
        document.getElementById('addClassBtn')?.addEventListener('click', async () => { const newName = prompt('请输入班级名称'); if(newName && newName.trim()) { await supabase.from('review_classes').insert({ id: Date.now(), name: newName.trim() }); loadClasses(); showToast('班级已添加'); } });
        document.getElementById('saveApiBtn')?.addEventListener('click', async () => { await saveApiConfigToDB(); showToast('API配置已保存'); });
        document.getElementById('testApiBtn')?.addEventListener('click', async () => { const cfg = { apiKey: document.getElementById('apiKey').value.trim(), modelId: document.getElementById('modelId').value.trim(), endpoint: document.getElementById('endpoint').value.trim() }; if(!cfg.apiKey || !cfg.modelId) { showToast('请填写完整配置', true); return; } try { const res = await fetch(cfg.endpoint, { method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${cfg.apiKey}`}, body: JSON.stringify({ model: cfg.modelId, messages:[{role:'user',content:'回复"ok"'}], max_tokens:5 }) }); if(res.ok) showToast('连接成功 ✅'); else showToast('连接失败', true); } catch(e){ showToast('网络异常', true); } });
        document.getElementById('exportDataBtn')?.addEventListener('click', exportData);
        document.getElementById('importDataBtn')?.addEventListener('click', () => { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json'; inp.onchange = e => { if(e.target.files[0]) importData(e.target.files[0]); }; inp.click(); });
        document.getElementById('clearAllDataBtn')?.addEventListener('click', clearAllData);
        document.getElementById('wordSlider')?.addEventListener('input', (e) => { document.getElementById('wordCountValue').innerText = e.target.value; });
        document.getElementById('monthWordSlider')?.addEventListener('input', (e) => { document.getElementById('targetWordDisplay').innerText = e.target.value; });
        document.getElementById('monthPicker').value = new Date().toISOString().slice(0,7);
        document.getElementById('toggleIndividualBtn')?.addEventListener('click', () => { const area = document.getElementById('individualPerfArea'); area.style.display = area.style.display === 'none' ? 'block' : 'none'; });
        document.getElementById('classFilterSelectGen')?.addEventListener('change', renderStudentChecklist);
        document.getElementById('nameFilterSelectGen')?.addEventListener('input', renderStudentChecklist);
        document.getElementById('filterClassSelect')?.addEventListener('change', () => renderStudentTable());
        document.getElementById('searchNameInput')?.addEventListener('input', () => renderStudentTable());
        
        refreshAll();
    }
    
    init();
</script>
</body>
</html>
